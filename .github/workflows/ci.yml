name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify runner trust boundary
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ruby scripts/test_ci_runner_trust.rb
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: command -v apt-get >/dev/null || exit 0; sudo apt-get update && sudo apt-get install -y libpulse-dev libdbus-1-dev pkg-config
      - name: cargo fmt check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: cargo test
        run: cargo test
